# The deployment's two shared secrets. Only the bus opens the database; every
# other service presents the token to the bus instead.
apiVersion: v1
kind: Secret
metadata:
  name: nanosec-secrets
  namespace: nanosec
type: Opaque
stringData:
  # The MongoDB the bus owns. Replace credentials and host before applying.
  mongo-uri: "mongodb://nanosec:change-me@EXTERNAL_MONGO_HOST:27017/nanobus?authSource=admin"
  # Shared token for the bus's internal endpoints, held by every component.
  internal-token: "change-me"
  # HMAC key for the work library's preview-session cookie. Replace it: every
  # running instance must share one, and rotating it invalidates open previews.
  artifact-session-secret: "change-me"
