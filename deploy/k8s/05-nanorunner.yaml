# nanorunner with the k8s provisioner backend.
# RBAC (ServiceAccount/Role/RoleBinding) is in nanorunner/deploy/k8s/rbac.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanorunner
  namespace: nanosec
spec:
  # One replica on purpose: with the docker backend each node runs its own runner
  # (it can only reach the runtime on that node), and the tunnel registry forwards
  # a request to the replica that holds the connection, so scaling this past one
  # only helps the k8s backend.
  replicas: 1
  selector:
    matchLabels:
      app: nanorunner
  template:
    metadata:
      labels:
        app: nanorunner
    spec:
      serviceAccountName: nanorunner
      containers:
        - name: nanorunner
          image: kobeyoung81/nanoprovisioner:${NANOPROVISIONER_VERSION}
          imagePullPolicy: IfNotPresent
          args: ["--bus-url", "ws://nanobus:9000"]
          env:
            - name: NANOSEC_BUS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanosec-secrets
                  key: internal-token
            - name: NANOSEC_ADMIN_URL
              value: "http://nanoadmin:8080"
            - name: NANOSEC_BUS_DATABASE_URI
              valueFrom:
                secretKeyRef:
                  name: nanosec-secrets
                  key: mongo-uri
            # How another replica reaches this runner's tunnel forwarding. With
            # one runner the Service name is enough.
            - name: NANOSEC_RUNNER_ADVERTISE_URL
              value: "http://nanorunner:8080"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
