# nanoadmin: configuration, catalogues, prompts, permission keys, alert rules and
# the audit trail. Stateless (it reads and writes only the database), so it runs
# with more than one replica behind its Service.
apiVersion: v1
kind: Service
metadata:
  name: nanoadmin
  namespace: nanosec
spec:
  selector:
    app: nanoadmin
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nanoadmin
  namespace: nanosec
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nanoadmin
  template:
    metadata:
      labels:
        app: nanoadmin
    spec:
      containers:
        - name: nanoadmin
          image: kobeyoung81/nanoadmin:${NANOADMIN_VERSION}
          imagePullPolicy: IfNotPresent
          env:
            - name: NANOSEC_ADMIN_MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: nanosec-secrets
                  key: mongo-uri
            - name: NANOSEC_BUS_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: nanosec-secrets
                  key: internal-token
            - name: NANOSEC_BUS_URL
              value: "http://nanobus:9000"
            - name: NANOAUTH_JWKS_URL
              value: "http://nanoauth:8081/auth/v1/.well-known/jwks"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
