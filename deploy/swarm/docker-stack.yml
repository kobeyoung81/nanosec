# Docker Swarm stack for the medium deployment tier (20-100 users).
#
# Uses an EXTERNAL MongoDB instance. Both values below (the bus's mongo URI and
# the shared token) come from the environment of the deploying shell: a swarm
# stack file cannot interpolate from .env, so export them first, e.g.
#   export NANOSEC_BUS_DATABASE_URI="mongodb://nanobus:PASS@db.example.com:27017/nanobus?authSource=admin"
#   export NANOSEC_BUS_INTERNAL_TOKEN="$(openssl rand -hex 24)"
#
# Bootstrap (run once, after MongoDB is reachable, from any manager node):
#   docker run --rm -e NANOSEC_BUS_DATABASE_URI="$NANOSEC_BUS_DATABASE_URI" \
#     kobeyoung81/nanobus:latest migrate up
#   docker run --rm -e NANOSEC_BUS_DATABASE_URI="$NANOSEC_BUS_DATABASE_URI" \
#     kobeyoung81/nanoadmin:nanosec config seed
#   docker run --rm -e NANOSEC_BUS_DATABASE_URI="$NANOSEC_BUS_DATABASE_URI" \
#     kobeyoung81/nanobus:latest config set runner backend swarm
#
# Deploy:
#   docker stack deploy -c deploy/swarm/docker-stack.yml nanosec
#
# nanorunner uses the swarm Provisioner backend (`runner.backend=swarm`) and
# creates one single-replica service per user with resource limits.
# For single-node testing with a local store, use the compose file instead
# (docker-compose.yml).
services:
  nanobus:
    image: kobeyoung81/nanobus:latest
    environment:
      NANOSEC_BUS_DATABASE_URI: ${NANOSEC_BUS_DATABASE_URI:?export NANOSEC_BUS_DATABASE_URI first}
      NANOSEC_BUS_NANOAUTH_BASE_URL: http://nanoauth:8081
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?export NANOSEC_BUS_INTERNAL_TOKEN first}
    networks: [nanosec]
    ports:
      - target: 9000
        published: 9000
    deploy:
      placement:
        constraints: [node.role == manager]

  nanoauth:
    image: kobeyoung81/nanoauth:latest
    environment:
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?export NANOSEC_BUS_INTERNAL_TOKEN first}
    networks: [nanosec]
    ports:
      - target: 8081
        published: 8081
    deploy:
      placement:
        constraints: [node.role == manager]

  nanogateway:
    image: kobeyoung81/nanogateway:latest
    command: ["--bus-url", "ws://nanobus:9000"]
    environment:
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?export NANOSEC_BUS_INTERNAL_TOKEN first}
    networks: [nanosec]
    deploy:
      replicas: 1

  nanorunner:
    image: kobeyoung81/nanorunner:latest
    command: ["--bus-url", "ws://nanobus:9000"]
    environment:
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?export NANOSEC_BUS_INTERNAL_TOKEN first}
    networks: [nanosec]
    deploy:
      replicas: 1

  nanoportal:
    image: kobeyoung81/nanoportal:latest
    environment:
      NANO_PORTAL_BUS_URL: http://nanobus:9000
      NANO_PORTAL_HYPERVISOR_URL: http://nanosec:9090
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?export NANOSEC_BUS_INTERNAL_TOKEN first}
    networks: [nanosec]
    ports:
      - target: 80
        published: 8080
    deploy:
      placement:
        constraints: [node.role == manager]

networks:
  nanosec:
    driver: overlay
    attachable: true
