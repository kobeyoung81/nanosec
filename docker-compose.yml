# One MongoDB instance, one database (nanosec), one prefix per module: the portal
# writes portal_, the admin module admin_, the provisioner provisioner_, the auth
# service auth_, the bus bus_/sys_, and the work library artifacts_/artifacts.
# Both URIs name that same database; a component writes only its own prefix and
# reads everything else over HTTP. Copy .env.example to .env and fill in the URIs
# and the shared token before `docker compose up -d`.
# Every Docker name in this stack derives from ENV_PREFIX plus the fixed base
# name `nanosec`: the project (`stg-nanosec`), the network
# (`stg-nanosec_default`), and — through NANOSEC_RUNNER_NAME_PREFIX — the agent
# containers (`stg-nanosec-agent-<id>`) and their data volumes
# (`stg-nanosec-data-<id>`). `ENV_PREFIX=dev-` for a development stack, empty for
# production. The only name that cannot follow the variable is the MongoDB
# database, where `-` becomes `_` (stg_nanosec) because it lives in the URI.
name: ${ENV_PREFIX:-}nanosec

services:
  # One-shot: applies the admin manifests and seeds the platform defaults the
  # console edits. It runs before bus-init because the bus's own seeds read
  # configuration (and because config is this module's collection).
  admin-init:
    build:
      context: ./nanoadmin
      args:
        VERSION: ${NANOADMIN_VERSION:-nanosec}
        COMMIT: ${NANOADMIN_COMMIT:-none}
        BUILD_DATE: ${NANOADMIN_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoadmin:${NANOADMIN_VERSION:-nanosec}
    entrypoint: ["sh", "-c"]
    command:
      - "for i in $$(seq 1 30); do nanoadmin migrate up && break; echo 'waiting for mongo...'; sleep 2; done; nanoadmin migrate up && nanoadmin config seed && nanoadmin permissions seed && nanoadmin agent-types seed && nanoadmin prompts seed && nanoadmin skills seed && nanoadmin mcp seed && echo 'admin init complete'"
    environment:
      NANOSEC_ADMIN_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Deleting a type asks the bus (owner of the agent rows) to clear refs.
      NANOSEC_BUS_URL: http://nanobus:9000
    restart: "no"

  # One-shot bootstrap: apply the collection manifests (with a retry loop for a
  # briefly-unreachable MongoDB) and seed the built-in catalogs.
  bus-init:
    build:
      context: ./nanobus
      args:
        VERSION: ${NANOBUS_VERSION:-nanosec}
        COMMIT: ${NANOBUS_COMMIT:-none}
        BUILD_DATE: ${NANOBUS_BUILD_DATE:-unknown}
    image: kobeyoung81/nanobus:${NANOBUS_VERSION:-nanosec}
    entrypoint: ["sh", "-c"]
    command:
      # `agent-types seed` runs before `prompts seed` on purpose: the prompt
      # seeder only writes onto types that already exist, so a fresh store with
      # the order reversed would come up with every built-in prompt blank.
      - "for i in $$(seq 1 30); do nanobus migrate up && break; echo 'waiting for mongo...'; sleep 2; done; nanobus migrate up && echo 'bus init complete'"
    environment:
      # The MongoDB the store reads and writes. Required: the bus refuses to
      # start without it.
      NANOSEC_BUS_DATABASE_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      # The bus reports its own administrators' actions to the admin module and
      # authenticates to it with this shared token.
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
    restart: "no"
    depends_on:
      admin-init:
        condition: service_completed_successfully

  nanobus:
    build:
      context: ./nanobus
      args:
        VERSION: ${NANOBUS_VERSION:-nanosec}
        COMMIT: ${NANOBUS_COMMIT:-none}
        BUILD_DATE: ${NANOBUS_BUILD_DATE:-unknown}
    image: kobeyoung81/nanobus:${NANOBUS_VERSION:-nanosec}
    entrypoint: nanobus
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # The MongoDB the store reads and writes. Required: the bus refuses to
      # start without it.
      NANOSEC_BUS_DATABASE_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      NANOSEC_BUS_NANOAUTH_BASE_URL: http://nanoauth:8081
      # Shared token for the bus's internal endpoints (REST + the tunnel and
      # terminal sockets). Every component of the stack holds the same value, and
      # so does every agent container the runner provisions. Override it from the
      # shell or .env; a deployment without one cannot talk to the bus at all.
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Config writes are forwarded to the module that owns the collection.
      NANOSEC_BUS_ADMIN_BASE_URL: http://nanoadmin:8080
      # Agent rows and their groups belong to the portal; the two writes this
      # service still receives for them (a runtime status and a deleted type's
      # reference cleanup) are forwarded there.
      NANOSEC_BUS_PORTAL_BASE_URL: http://nanoportal:80
      # The provisioning queue is the runner's; the console's container actions
      # are forwarded to it.
      NANOSEC_BUS_PROVISIONER_BASE_URL: http://nanorunner:8080
    ports:
      # Only the portal is meant to be reachable from off the host; the rest are
      # published on the loopback interface for local operators and probes.
      - "127.0.0.1:14400:9000"
    depends_on:
      bus-init:
        condition: service_completed_successfully

  # Identity: accounts, tokens and JWKS. It owns the auth_ collections and talks
  # to the admin module for its configuration and audit trail.
  nanoauth:
    build:
      context: ./nanoauth
      args:
        VERSION: ${NANOAUTH_VERSION:-nanosec}
        COMMIT: ${NANOAUTH_COMMIT:-none}
        BUILD_DATE: ${NANOAUTH_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoauth:${NANOAUTH_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Identity's own collections live in the platform database.
      NANOAUTH_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Configuration (the JWT keypair, directory settings) comes from admin.
      NANOSEC_ADMIN_URL: http://nanoadmin:8080
      NANOAUTH_ADDR: ":8081"
    ports:
      - "127.0.0.1:${NANOAUTH_PORT:-14401}:8081"
    depends_on:
      admin-init:
        condition: service_completed_successfully
      nanoadmin:
        condition: service_started

  nanorunner:
    build:
      context: ./nanoprovisioner
      args:
        VERSION: ${NANOPROVISIONER_VERSION:-nanosec}
        COMMIT: ${NANOPROVISIONER_COMMIT:-none}
        BUILD_DATE: ${NANOPROVISIONER_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoprovisioner:${NANOPROVISIONER_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - nanobus
    environment:
      # Optional: override the Docker network agent containers attach to (the
      # runner auto-detects its own Compose network when unset/incorrect).
      # Empty means "the network this runner is attached to", which is this
      # project's own <project>_default. Leaving it empty is how the stack stays
      # correct without a second variable.
      NANOSEC_RUNNER_NETWORK: ${NANOSEC_RUNNER_NETWORK:-}
      NANOSEC_RUNNER_AGENT_IMAGE: ${NANOSEC_RUNNER_AGENT_IMAGE:-}
      # Prefix for the agent container and data volume names: the same variable
      # that names the compose project names them too.
      NANOSEC_RUNNER_NAME_PREFIX: ${ENV_PREFIX:-}
      # Shared token for the bus's internal endpoints (REST + the tunnel and
      # terminal sockets). Every component of the stack holds the same value, and
      # so does every agent container the runner provisions. Override it from the
      # shell or .env; a deployment without one cannot talk to the bus at all.
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Configuration is served by the admin module; these services ask it over HTTP.
      NANOSEC_ADMIN_URL: http://nanoadmin:8080
      # The provisioning queue is this service's now, so it opens the platform
      # database and applies its own manifests.
      NANOSEC_PROVISIONER_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      # Where the internal API listens; the bus forwards the console's container
      # actions here (bus → runner, the same shape as bus → admin), and the
      # terminal bridge is dialed here by the gateway.
      NANOSEC_PROVISIONER_ADDR: ":8080"
      # Hypervisor tunnels terminate here now. Containers are told where to dial
      # through runner.tunnelUrl; this value is what they get.
      NANOSEC_RUNNER_TUNNEL_URL: ws://nanorunner:8080
      # How another replica reaches this runner's tunnel forwarding. Give each
      # runner a distinct address when there is more than one.
      NANOSEC_RUNNER_ADVERTISE_URL: http://nanorunner:8080
      # The terminal bridge re-checks agent ownership against the module that
      # owns the rows.
      NANOSEC_PORTAL_URL: http://nanoportal:80
    volumes:
      # The trust root of the platform: the runner must talk to the Docker
      # API to provision agent containers, so it holds effectively host-root
      # power. Anything that compromises this container compromises the host,
      # and nothing else in this compose file should get this mount.
      - /var/run/docker.sock:/var/run/docker.sock
    command: ["--bus-url", "ws://nanobus:9000", "--runner-id", "${ENV_PREFIX:-}nanosec"]

  # The workspace surface: the file browser, previews and the git panel. It holds
  # no data — the bytes live in the agent container's volume, the agent rows in
  # the portal — so it scales like any other stateless module.
  nanoworkspace:
    build:
      context: ./nanoworkspace
      args:
        VERSION: ${NANOWORKSPACE_VERSION:-nanosec}
        COMMIT: ${NANOWORKSPACE_COMMIT:-none}
        BUILD_DATE: ${NANOWORKSPACE_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoworkspace:${NANOWORKSPACE_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      NANOSEC_WORKSPACE_ADDR: ":8080"
      # Browser tokens are verified here against nanoauth's key set.
      NANOAUTH_JWKS_URL: http://nanoauth:8081/auth/v1/.well-known/jwks
      # Who owns this agent (the portal), where the tunnel terminates (the
      # provisioner) and the fallback for containers not yet restarted.
      NANOSEC_PORTAL_URL: http://nanoportal:80
      NANOSEC_PROVISIONER_URL: http://nanorunner:8080
      NANOSEC_BUS_URL: http://nanobus:9000
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
    depends_on:
      - nanoportal
      - nanorunner

  # Chat platform gateway. Requires at least one channel enabled in the bus  # config (portal → Configs → gateway, e.g. channels.web.enabled=true is the
  # default). The web channel (:8080) serves the portal's browser chat and is
  # published so browsers can reach it (see VITE_GATEWAY_URL in nanoportal).
  nanogateway:
    build:
      context: ./nanogateway
      args:
        VERSION: ${NANOGATEWAY_VERSION:-nanosec}
        COMMIT: ${NANOGATEWAY_COMMIT:-none}
        BUILD_DATE: ${NANOGATEWAY_BUILD_DATE:-unknown}
    image: kobeyoung81/nanogateway:${NANOGATEWAY_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    depends_on:
      - nanobus
    ports:
      - "127.0.0.1:14402:8080"
    environment:
      # Shared token for the bus's internal endpoints (REST + the tunnel and
      # terminal sockets). Every component of the stack holds the same value, and
      # so does every agent container the runner provisions. Override it from the
      # shell or .env; a deployment without one cannot talk to the bus at all.
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Configuration is served by the admin module; these services ask it over HTTP.
      NANOSEC_ADMIN_URL: http://nanoadmin:8080
      # The agent rows and the conversation projection are the portal's; the two
      # reads the channel needs (the user's agents, a session's metadata) go
      # there instead of through the bus.
      NANOSEC_PORTAL_URL: http://nanoportal:80
      # Tunnels terminate at the provisioner, so the terminal bridge is dialed
      # there first (the bus stays as a fallback for containers not yet restarted).
      NANOSEC_PROVISIONER_URL: http://nanorunner:8080
    command: ["--bus-url", "ws://nanobus:9000"]

  nanoportal:
    build:
      context: ./nanoportal
      args:
        VERSION: ${NANOPORTAL_VERSION:-nanosec}
        COMMIT: ${NANOPORTAL_COMMIT:-none}
        BUILD_DATE: ${NANOPORTAL_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoportal:${NANOPORTAL_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      NANO_PORTAL_BUS_URL: http://nanobus:9000
      # Shared token for the bus's internal endpoints (REST + the tunnel and
      # terminal sockets). Every component of the stack holds the same value, and
      # so does every agent container the runner provisions. Override it from the
      # shell or .env; a deployment without one cannot talk to the bus at all.
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Configuration is served by the admin module; these services ask it over HTTP.
      NANOSEC_ADMIN_URL: http://nanoadmin:8080
      # The portal owns the user-facing data now: agents, groups, preferences
      # and the session projection, all under portal_.
      NANOPORTAL_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
    ports:
      - "14403:80"
    depends_on:
      # nginx proxies the gateway's web channel under the same origin; starting
      # after it means the upstream name resolves to the right container even
      # before the first reload (see the resolver in nanoportal/deploy/nginx.conf).
      - nanogateway
      - nanobus

  # The work library: its own service, its own MongoDB database, its own front
  # end. The second component that holds a database connection — deliberately,
  # and scoped to its own database (see the header note). Reached only through
  # the portal's nginx, which proxies /artifacts/ at the same origin.
  nanoartifacts:
    build:
      context: ./nanoartifacts
      args:
        VERSION: ${NANOARTIFACTS_VERSION:-nanosec}
        COMMIT: ${NANOARTIFACTS_COMMIT:-none}
        BUILD_DATE: ${NANOARTIFACTS_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoartifacts:${NANOARTIFACTS_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Its own database, not the bus's. Required: the service refuses to start
      # without it (a missing URI must not fall back to a default database).
      # One database, one connection string: the work library lives in the same
      # database under the artifacts_ prefix. Deliberately derived from the
      # platform URI so a stale NANOARTIFACTS_MONGO_URI in an old .env cannot
      # silently point this service at the pre-merge database.
      NANOARTIFACTS_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      # HMAC key for the preview-session cookie the iframe carries. The cookie
      # is scoped to this service's API path; every request re-checks the
      # artifact's permissions, so revoking a share is immediate.
      NANOARTIFACTS_SESSION_SECRET: ${NANOARTIFACTS_SESSION_SECRET:?set NANOARTIFACTS_SESSION_SECRET in .env}
      # Scope of the preview cookie. "/" works wherever the portal is mounted;
      # tighten to the external API path (/nanoartifacts/api) if you want it
      # confined, but a mismatch silently produces 401s.
      NANOARTIFACTS_COOKIE_PATH: ${NANOARTIFACTS_COOKIE_PATH:-/}
      # Per-user storage ceiling, counted after content dedupe.
      NANOARTIFACTS_QUOTA_BYTES: ${NANOARTIFACTS_QUOTA_BYTES:-2147483648}
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Identity has two owners, and this service asks each of them directly:
      # the portal keeps the agent rows (agent -> owner), nanoauth keeps the
      # accounts (display names, address lookups). Neither is a bus call: the
      # bus stopped serving those surfaces, and asking it answered "unknown
      # agent" to every publish.
      NANOSEC_PORTAL_URL: http://nanoportal:80
      NANOAUTH_INTERNAL_URL: http://nanoauth:8081
      # The same keys the portal validates against: identity is nanoauth's, not
      # a local user table.
      NANOAUTH_JWKS_URL: http://nanoauth:8081/auth/v1/.well-known/jwks
    depends_on:
      - nanoportal
      - nanoauth

  # The admin domain: agent-type/model/capability/prompt/permission-key/audit
  # and configuration catalogues. Owns the admin_ prefix; the bus keeps only
  # messages and asks this service over HTTP for what it needs.
  nanoadmin:
    build:
      context: ./nanoadmin
      args:
        VERSION: ${NANOADMIN_VERSION:-nanosec}
        COMMIT: ${NANOADMIN_COMMIT:-none}
        BUILD_DATE: ${NANOADMIN_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoadmin:${NANOADMIN_VERSION:-nanosec}
    restart: unless-stopped
    # One file descriptor per open tunnel, stream subscription and database
    # connection: the default 1024 soft limit is reached long before the
    # platform is busy. The tunnel rules assume room for 65536.
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    environment:
      # Same database as every module, under the admin_ prefix.
      NANOSEC_ADMIN_MONGO_URI: ${NANOSEC_BUS_DATABASE_URI:?set NANOSEC_BUS_DATABASE_URI in .env}
      NANOSEC_BUS_INTERNAL_TOKEN: ${NANOSEC_BUS_INTERNAL_TOKEN:?set NANOSEC_BUS_INTERNAL_TOKEN in .env}
      # Deleting a type asks the bus (owner of the agent rows) to clear refs.
      NANOSEC_BUS_URL: http://nanobus:9000
      # Browser tokens are verified here once nginx routes the console
      # directly; without this URL only the internal token is accepted.
      NANOAUTH_JWKS_URL: http://nanoauth:8081/auth/v1/.well-known/jwks
      # The container control plane: restart/dispose/reprovision ask the queue's
      # owner to move the container (desired state, executed by its poll loop).
      NANOSEC_ADMIN_PROVISIONER_URL: http://nanorunner:8080
    ports:
      - "127.0.0.1:${NANOSEC_ADMIN_PORT:-14404}:8080"
    depends_on:
      - nanobus

  # Builds/tags the agent image nanorunner provisions per-user containers from
  # (kobeyoung81/nanoagent:<NANOAGENT_VERSION>, local default `nanosec`). Not
  # started as part of `up`; build it with: docker compose build nanosec
  nanosec:
    build:
      context: ./nanoagent
      args:
        VERSION: ${NANOAGENT_VERSION:-nanosec}
        COMMIT: ${NANOAGENT_COMMIT:-none}
        BUILD_DATE: ${NANOAGENT_BUILD_DATE:-unknown}
    image: kobeyoung81/nanoagent:${NANOAGENT_VERSION:-nanosec}
    profiles: ["agent"]
    command: ["version"]
