    <path d="M154 444H886" stroke="#b3c0d1" stroke-width="2" fill="none"/>
    <path d="M520 444V466" stroke="#b3c0d1" stroke-width="2" fill="none"/>
    <rect x="340" y="466" width="360" height="56" rx="14" fill="#0f172a"/>
    <text x="520" y="501" text-anchor="middle" font-size="20" font-weight="600" fill="#ffffff">one MongoDB</text>
    <text x="520" y="560" text-anchor="middle" font-size="14" fill="#4c5c72">A module writes only its own prefix; cross-module reads go over internal HTTP with the shared token.</text>
