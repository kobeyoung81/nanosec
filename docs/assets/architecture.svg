    <text x="940" y="58" text-anchor="middle" font-size="15" fill="#4c5c72">Mini Program</text>
    <path d="M100 74V96 M268 74V96 M436 74V96 M604 74V96 M772 74V96 M940 74V96" stroke="#b3c0d1" stroke-width="2" fill="none"/>
    <path d="M100 96H940" stroke="#b3c0d1" stroke-width="2" fill="none"/>
