<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="NanoSec architecture: channels, one entry, eight services, one database with one prefix per module">
  <title>NanoSec architecture</title>
  <defs>
    <style>
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .chip { fill: #F1F5F9; }
      .card { fill: #FFFFFF; stroke: #E2E8F0; stroke-width: 2; }
      .wire { stroke: #CBD5E1; stroke-width: 2; }
      .ink { fill: #0F172A; }
      .dim { fill: #64748B; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="420" fill="#FFFFFF"/>

  <!-- channels -->
  <g class="txt" font-size="13" fill="#334155">
    <rect class="chip" x="130" y="40" width="160" height="36" rx="10"/><text x="210" y="63" text-anchor="middle">Web chat</text>
    <rect class="chip" x="302" y="40" width="160" height="36" rx="10"/><text x="382" y="63" text-anchor="middle">WeCom</text>
    <rect class="chip" x="474" y="40" width="160" height="36" rx="10"/><text x="554" y="63" text-anchor="middle">Feishu</text>
    <rect class="chip" x="646" y="40" width="160" height="36" rx="10"/><text x="726" y="63" text-anchor="middle">WeChat KF</text>
    <rect class="chip" x="818" y="40" width="160" height="36" rx="10"/><text x="898" y="63" text-anchor="middle">CLI</text>
    <rect class="chip" x="990" y="40" width="160" height="36" rx="10"/><text x="1070" y="63" text-anchor="middle">Mini Program</text>
  </g>

  <!-- channels -> entry -->
  <g class="wire">
    <line x1="210" y1="76" x2="210" y2="100"/>
    <line x1="382" y1="76" x2="382" y2="100"/>
    <line x1="554" y1="76" x2="554" y2="100"/>
    <line x1="726" y1="76" x2="726" y2="100"/>
    <line x1="898" y1="76" x2="898" y2="100"/>
    <line x1="1070" y1="76" x2="1070" y2="100"/>
    <line x1="210" y1="100" x2="1070" y2="100"/>
    <line x1="640" y1="100" x2="640" y2="130"/>
  </g>

  <!-- entry -->
  <rect x="430" y="130" width="420" height="50" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="2"/>
  <text class="txt ink" x="640" y="152" font-size="14" font-weight="600" text-anchor="middle">nginx — one origin, prefix per service</text>
  <text class="txt dim" x="640" y="170" font-size="11" text-anchor="middle">TLS, static assets, /plugins/&lt;id&gt;/</text>

  <!-- entry -> services -->
  <g class="wire">
    <line x1="640" y1="180" x2="640" y2="205"/>
    <line x1="143" y1="205" x2="1137" y2="205"/>
    <line x1="143" y1="205" x2="143" y2="230"/>
    <line x1="285" y1="205" x2="285" y2="230"/>
    <line x1="427" y1="205" x2="427" y2="230"/>
    <line x1="569" y1="205" x2="569" y2="230"/>
    <line x1="711" y1="205" x2="711" y2="230"/>
    <line x1="853" y1="205" x2="853" y2="230"/>
    <line x1="995" y1="205" x2="995" y2="230"/>
    <line x1="1137" y1="205" x2="1137" y2="230"/>
  </g>

  <!-- services -->
  <g>
    <rect class="card" x="78" y="230" width="130" height="58" rx="10"/>
    <rect class="card" x="220" y="230" width="130" height="58" rx="10"/>
    <rect class="card" x="362" y="230" width="130" height="58" rx="10"/>
    <rect class="card" x="504" y="230" width="130" height="58" rx="10"/>
    <rect class="card" x="646" y="230" width="130" height="58" rx="10"/>
    <rect class="card" x="788" y="230" width="130" height="58" rx="10"/>
    <rect x="930" y="230" width="130" height="58" rx="10" fill="#EEF2FF" stroke="#2F6BFF" stroke-width="2"/>
    <rect class="card" x="1072" y="230" width="130" height="58" rx="10"/>
  </g>
  <g class="txt" text-anchor="middle">
    <text class="ink" x="143" y="256" font-size="13" font-weight="600">portal</text><text class="dim" x="143" y="274" font-size="11">console</text>
    <text class="ink" x="285" y="256" font-size="13" font-weight="600">auth</text><text class="dim" x="285" y="274" font-size="11">identity</text>
    <text class="ink" x="427" y="256" font-size="13" font-weight="600">admin</text><text class="dim" x="427" y="274" font-size="11">config · audit</text>
    <text class="ink" x="569" y="256" font-size="13" font-weight="600">artifacts</text><text class="dim" x="569" y="274" font-size="11">work library</text>
    <text class="ink" x="711" y="256" font-size="13" font-weight="600">workspace</text><text class="dim" x="711" y="274" font-size="11">files · git</text>
    <text class="ink" x="853" y="256" font-size="13" font-weight="600">gateway</text><text class="dim" x="853" y="274" font-size="11">channels</text>
    <text class="ink" x="995" y="256" font-size="13" font-weight="600">bus</text><text class="dim" x="995" y="274" font-size="11">messages only</text>
    <text class="ink" x="1137" y="256" font-size="13" font-weight="600">provisioner</text><text class="dim" x="1137" y="274" font-size="11">containers</text>
  </g>

  <!-- services -> database -->
  <g class="wire">
    <line x1="143" y1="288" x2="143" y2="310"/>
    <line x1="285" y1="288" x2="285" y2="310"/>
    <line x1="427" y1="288" x2="427" y2="310"/>
    <line x1="569" y1="288" x2="569" y2="310"/>
    <line x1="711" y1="288" x2="711" y2="310"/>
    <line x1="853" y1="288" x2="853" y2="310"/>
    <line x1="995" y1="288" x2="995" y2="310"/>
    <line x1="1137" y1="288" x2="1137" y2="310"/>
    <line x1="143" y1="310" x2="1137" y2="310"/>
    <line x1="640" y1="310" x2="640" y2="334"/>
  </g>

  <!-- database -->
  <rect x="360" y="334" width="560" height="52" rx="12" fill="#0F172A"/>
  <text class="txt" x="386" y="356" font-size="14" font-weight="700" fill="#FFFFFF">one MongoDB</text>
  <text x="386" y="374" font-size="10" fill="#94A3B8" font-family="ui-monospace, Menlo, Consolas, monospace">auth_ · admin_ · portal_ · bus_ · provisioner_ · sys_ · artifacts_ · workspace_</text>

  <text class="txt dim" x="640" y="412" font-size="11" text-anchor="middle">A module writes only its own prefix; cross-module reads go over internal HTTP with the shared token.</text>
</svg>
