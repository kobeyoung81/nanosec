<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="NanoSec — self-hosted, multi-user AI assistant platform in Go">
  <title>NanoSec</title>
  <rect x="0" y="0" width="1280" height="360" rx="28" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1278" height="358" rx="27" fill="none" stroke="#E2E8F0" stroke-width="2"/>

  <g transform="translate(72 96)">
    <rect x="0" y="0" width="88" height="88" rx="22" fill="#EEF2FF"/>
    <path d="M44 14 L64.7 26 L64.7 50 L44 62 L23.3 50 L23.3 26 Z"
          fill="none" stroke="#1E293B" stroke-width="3.4" stroke-linejoin="round"/>
    <g stroke="#94A3B8" stroke-width="3" stroke-linecap="round">
      <line x1="44" y1="38" x2="44" y2="14"/>
      <line x1="44" y1="38" x2="23.3" y2="50"/>
      <line x1="44" y1="38" x2="64.7" y2="50"/>
    </g>
    <circle cx="44" cy="38" r="7" fill="#2F6BFF"/>
  </g>

  <text x="196" y="140" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="58" font-weight="700" fill="#0F172A" letter-spacing="-1">NanoSec</text>

  <text x="196" y="200" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="22" fill="#334155">Self-hosted, multi-user AI assistant platform in Go.</text>
  <text x="196" y="234" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif"
        font-size="22" fill="#334155">One container per user, every channel, one MongoDB.</text>

  <g font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="16" fill="#475569">
    <rect x="196" y="266" width="104" height="34" rx="17" fill="#EEF2FF"/>
    <text x="248" y="288" text-anchor="middle">Go 1.26</text>
    <rect x="312" y="266" width="140" height="34" rx="17" fill="#ECFDF5"/>
    <text x="382" y="288" text-anchor="middle">Self-hosted</text>
    <rect x="464" y="266" width="150" height="34" rx="17" fill="#FEF3C7"/>
    <text x="539" y="288" text-anchor="middle">Multi-tenant</text>
  </g>

  <g stroke="#E2E8F0" stroke-width="2.5">
    <line x1="952" y1="122" x2="1112" y2="104"/>
    <line x1="952" y1="122" x2="1006" y2="248"/>
    <line x1="1112" y1="104" x2="1196" y2="196"/>
    <line x1="1006" y1="248" x2="1196" y2="196"/>
    <line x1="952" y1="122" x2="1196" y2="196"/>
    <line x1="1112" y1="104" x2="1150" y2="250"/>
    <line x1="1150" y1="250" x2="1196" y2="196"/>
  </g>
  <circle cx="952" cy="122" r="9" fill="#CBD5E1"/>
  <circle cx="1112" cy="104" r="9" fill="#CBD5E1"/>
  <circle cx="1006" cy="248" r="9" fill="#CBD5E1"/>
  <circle cx="1150" cy="250" r="9" fill="#CBD5E1"/>
  <circle cx="1196" cy="196" r="13" fill="#2F6BFF"/>
</svg>
