<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" role="img" aria-label="NanoSec console — chat, agents and admin in one shell">
  <title>NanoSec console (illustration)</title>
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .line { stroke: #E2E8F0; stroke-width: 2; }
      .card { fill: #FFFFFF; }
      .soft { fill: #F1F5F9; }
      .tint { fill: #EEF2FF; }
      .bar { fill: #CBD5E1; }
      .bar2 { fill: #E2E8F0; }
      .ink { fill: #334155; }
      .dim { fill: #64748B; }
      .txt { font-family: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1440" height="900"/>
  <rect x="1" y="1" width="1438" height="898" fill="none" class="line"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1440" height="64" class="card"/>
  <line x1="0" y1="64" x2="1440" y2="64" class="line"/>
  <circle cx="36" cy="32" r="14" fill="#2F6BFF"/>
  <circle cx="36" cy="32" r="5" fill="#FFFFFF"/>
  <text class="txt ink" x="62" y="39" font-size="19" font-weight="700">NanoSec</text>
  <text class="txt dim" x="172" y="39" font-size="15">Chat</text>
  <text class="txt dim" x="218" y="39" font-size="15">/</text>
  <text class="txt ink" x="234" y="39" font-size="15">My Agent</text>
  <g class="txt dim" font-size="14">
    <rect class="soft" x="1178" y="18" width="66" height="28" rx="14"/>
    <text x="1211" y="37" text-anchor="middle">Docs</text>
    <rect class="soft" x="1254" y="18" width="72" height="28" rx="14"/>
    <text x="1290" y="37" text-anchor="middle">Admin</text>
  </g>
  <circle cx="1364" cy="32" r="16" fill="#CBD5E1"/>
  <circle cx="1364" cy="27" r="6" fill="#FFFFFF"/>
  <path d="M1352 42 q12 -10 24 0" fill="#FFFFFF"/>

  <!-- sidebar -->
  <rect x="0" y="64" width="300" height="836" class="card"/>
  <line x1="300" y1="64" x2="300" y2="900" class="line"/>
  <text class="txt ink" x="28" y="110" font-size="18" font-weight="600">Conversations</text>
  <rect class="soft" x="24" y="130" width="252" height="40" rx="10"/>
  <text class="txt dim" x="42" y="155" font-size="14">Search</text>

  <rect class="tint" x="16" y="190" width="268" height="54" rx="12"/>
  <rect x="16" y="190" width="4" height="54" rx="2" fill="#2F6BFF"/>
  <rect class="bar" x="34" y="207" width="152" height="10" rx="5"/>
  <rect class="bar2" x="34" y="226" width="96" height="8" rx="4"/>

  <rect x="16" y="256" width="268" height="54" rx="12"/>
  <rect class="bar" x="34" y="273" width="128" height="10" rx="5"/>
  <rect class="bar2" x="34" y="292" width="112" height="8" rx="4"/>

  <rect x="16" y="322" width="268" height="54" rx="12"/>
  <rect class="bar" x="34" y="339" width="168" height="10" rx="5"/>
  <rect class="bar2" x="34" y="358" width="72" height="8" rx="4"/>

  <rect x="16" y="388" width="268" height="54" rx="12"/>
  <rect class="bar" x="34" y="405" width="112" height="10" rx="5"/>
  <rect class="bar2" x="34" y="424" width="132" height="8" rx="4"/>

  <rect x="16" y="454" width="268" height="54" rx="12"/>
  <rect class="bar" x="34" y="471" width="144" height="10" rx="5"/>
  <rect class="bar2" x="34" y="490" width="88" height="8" rx="4"/>

  <!-- message: user -->
  <rect x="760" y="112" width="620" height="66" rx="16" fill="#2F6BFF"/>
  <rect x="784" y="132" width="420" height="10" rx="5" fill="#FFFFFF" opacity="0.92"/>
  <rect x="784" y="152" width="300" height="10" rx="5" fill="#FFFFFF" opacity="0.7"/>

  <!-- message: assistant -->
  <rect class="card" x="332" y="204" width="700" height="118" rx="16"/>
  <rect x="332" y="204" width="700" height="118" rx="16" fill="none" class="line"/>
  <circle cx="362" cy="232" r="10" fill="#2F6BFF"/>
  <text class="txt dim" x="382" y="237" font-size="13">My Agent</text>
  <rect class="bar" x="356" y="258" width="620" height="10" rx="5"/>
  <rect class="bar" x="356" y="278" width="560" height="10" rx="5"/>
  <rect class="bar" x="356" y="298" width="380" height="10" rx="5"/>

  <!-- tool call card -->
  <rect class="soft" x="332" y="340" width="540" height="128" rx="14"/>
  <rect x="332" y="340" width="540" height="128" rx="14" fill="none" class="line"/>
  <rect x="352" y="360" width="18" height="18" rx="5" fill="#2F6BFF"/>
  <text class="txt ink" x="380" y="375" font-size="14" font-weight="600">shell</text>
  <text class="mono dim" x="432" y="375" font-size="13">git status --short</text>
  <rect class="bar2" x="352" y="394" width="440" height="8" rx="4"/>
  <rect class="bar2" x="352" y="412" width="380" height="8" rx="4"/>
  <rect class="bar2" x="352" y="430" width="300" height="8" rx="4"/>

  <!-- message: assistant (second) -->
  <rect class="card" x="332" y="486" width="620" height="96" rx="16"/>
  <rect x="332" y="486" width="620" height="96" rx="16" fill="none" class="line"/>
  <rect class="bar" x="356" y="514" width="540" height="10" rx="5"/>
  <rect class="bar" x="356" y="534" width="460" height="10" rx="5"/>
  <rect class="bar" x="356" y="554" width="240" height="10" rx="5"/>

  <!-- composer -->
  <rect class="card" x="332" y="768" width="1048" height="84" rx="18"/>
  <rect x="332" y="768" width="1048" height="84" rx="18" fill="none" class="line"/>
  <rect class="bar2" x="360" y="792" width="420" height="10" rx="5"/>
  <rect class="bar2" x="360" y="814" width="260" height="10" rx="5"/>
  <circle cx="1334" cy="810" r="20" fill="#2F6BFF"/>
  <path d="M1326 810 h16 M1336 803 l7 7 -7 7" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text class="txt dim" x="332" y="736" font-size="13">Agents: My Agent · Reviewer · Researcher</text>
  <text class="txt dim" x="1140" y="886" font-size="12" text-anchor="end">illustration — real screenshots coming</text>
</svg>
